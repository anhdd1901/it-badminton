# Copy of .github/workflows/backup.yml in the private backup repo (it-badminton-backup).
# Edit here first, then copy to the backup repo (see docs/ops/runbook.md).
name: Backup

on:
  schedule:
    # Sunday 23:17 Asia/Ho_Chi_Minh (16:17 UTC); off the hour, when GitHub delays fewer runs.
    - cron: "17 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Configure git
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"

      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash ./backup.sh .

      - name: Commit and push
        run: |
          bash ./commit.sh .
          git push
